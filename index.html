<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Quant Web</title>
  </head>
  <body>
    <!-- 全透明 Navbar -->
    <header class="navbar">
      <div class="nav-inner">
        <a href="/" class="logo">
          <img src="/logo.png" alt="Logo" class="logo-img">
          <span class="logo-text">MyQuant</span>
        </a>
        
        <!-- 3點按鈕 (細少少) -->
        <button id="menu-btn" class="menu-btn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- 遮罩層 (撳主畫面關閉 Sidebar) -->
    <div id="overlay" class="overlay"></div>

    <!-- 右側 Sidebar -->
    <div id="sidebar" class="sidebar">
      <button id="close-btn" class="close-btn">✕</button>
      <div class="sidebar-content">
        
        <div class="theme-section">
          <h4>主題設定</h4>
          <select id="theme-select" class="theme-select">
            <option value="system">🌓 跟隨系統</option>
            <option value="light">☀️ 日間</option>
            <option value="dark">🌙 夜間</option>
          </select>
        </div>

        <div class="sidebar-links">
          <a href="#">關於我們</a>
          <a href="#">最新消息</a>
          <a href="#">幫助中心</a>
          <a href="#">支持我們</a>
        </div>
        
        <div class="sidebar-bottom">
          <div class="lang-switch">
            <span>中文</span> | <span>EN</span>
          </div>
          <a href="https://facebook.com" target="_blank" class="social-link">Facebook</a>
        </div>
      </div>
    </div>

    <main id="app"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
