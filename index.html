<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Loading...</title> <!-- 標題會由 JS 更新 -->
  </head>
  <body class="loading">
    <!-- 全透明 Navbar -->
    <header class="navbar">
      <div class="nav-inner">
        <a href="/" class="logo" id="home-logo">
          <img src="" alt="Logo" class="logo-img"> 
        </a>
        
        <button id="menu-btn" class="menu-btn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div id="overlay" class="overlay"></div>

    <div id="sidebar" class="sidebar">
      <button id="close-btn" class="close-btn">✕</button>
      <div class="sidebar-content">
        <div class="theme-section">
          <h4 id="theme-title">主題設定</h4>
          <div class="icon-btn-group" id="theme-group">
            <button class="icon-btn theme-opt" data-theme="light">☀️</button>
            <button class="icon-btn theme-opt" data-theme="system">💻</button>
            <button class="icon-btn theme-opt" data-theme="dark">🌙</button>
          </div>
        </div>
        <div class="sidebar-links"></div> <!-- 呢度留空，等 JS 填 -->
        <div class="sidebar-bottom">
          <div class="lang-switch">
            <span id="lang-label">語言</span>:
            <button class="lang-btn" data-lang="zh" id="lang-btn-zh"></button> | 
            <button class="lang-btn" data-lang="en" id="lang-btn-en"></button>
          </div>
          <a href="#" id="social-fb" target="_blank" class="social-link">Facebook</a>
        </div>
      </div>
    </div>

    <main id="app"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
